<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Z&M - Logo Semicírculos Cometa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  .logo-container {
    width: 600px;
    height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  @media (prefers-reduced-motion: no-preference) {
    .ring-pulse {
      animation: rpulse 4s ease-in-out infinite;
    }
    .orbit {
      transform-origin: 340px 225px;
      animation: spin 12s linear infinite;
    }
  }
  @keyframes rpulse {
    0%, 100% { stroke-width: 2.8; opacity: 0.8; }
    50% { stroke-width: 3.5; opacity: 1; }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="logo-container">
<svg width="100%" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="ring-gr" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1B2A4A"/>
    <stop offset="50%" stop-color="#4A90C4"/>
    <stop offset="100%" stop-color="#2E7D32"/>
  </linearGradient>

  <linearGradient id="comet-navy" gradientUnits="userSpaceOnUse" x1="440" y1="125" x2="440" y2="325">
    <stop offset="0%" stop-color="#1B2A4A" stop-opacity="1"/>
    <stop offset="60%" stop-color="#1B2A4A" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#1B2A4A" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="comet-blue" gradientUnits="userSpaceOnUse" x1="415" y1="150" x2="415" y2="300">
    <stop offset="0%" stop-color="#4A90C4" stop-opacity="1"/>
    <stop offset="60%" stop-color="#4A90C4" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#4A90C4" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="comet-green" gradientUnits="userSpaceOnUse" x1="390" y1="175" x2="390" y2="275">
    <stop offset="0%" stop-color="#2E7D32" stop-opacity="1"/>
    <stop offset="60%" stop-color="#2E7D32" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#2E7D32" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Main outer circle -->
<circle class="ring-pulse" cx="340" cy="225" r="130" fill="none" stroke="url(#ring-gr)" stroke-width="3"/>

<!-- Rotating group -->
<g class="orbit">
  <!-- Navy comet - r=100 -->
  <path d="M340 325 A100 100 0 0 1 340 125" fill="none" stroke="url(#comet-navy)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="340" cy="125" r="5" fill="#1B2A4A"/>

  <!-- Light blue comet - r=75 -->
  <path d="M340 300 A75 75 0 0 1 340 150" fill="none" stroke="url(#comet-blue)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="340" cy="150" r="4.5" fill="#4A90C4"/>

  <!-- Green comet - r=50 -->
  <path d="M340 275 A50 50 0 0 1 340 175" fill="none" stroke="url(#comet-green)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="340" cy="175" r="4" fill="#2E7D32"/>
</g>

<!-- Text centered -->
<text x="340" y="215" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="5" fill="#888888">GRUPO</text>
<text x="340" y="250" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="500" letter-spacing="2" fill="#1B2A4A">Z<tspan fill="#C62828">&amp;</tspan>M</text>

</svg>
</div>
</body>
</html>
