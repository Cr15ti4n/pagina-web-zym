# ───────────────────────────────────────────────
# Configuracion NGINX para servir .webp correctamente
# (corrige el signo de interrogacion en las imagenes)
#
# Esto NO se sube al hosting como archivo: hay que pegarlo
# dentro de la configuracion del servidor Nginx.
# ───────────────────────────────────────────────

# OPCION A (recomendada): agregar el tipo MIME globalmente.
# En el archivo /etc/nginx/mime.types, dentro del bloque "types { ... }",
# agrega esta linea (si no existe ya):
#
#     image/webp  webp;
#     image/avif  avif;
#
# Luego recarga Nginx:  sudo nginx -t && sudo systemctl reload nginx


# OPCION B: si no puedes editar mime.types, pega esto dentro
# del bloque "server { ... }" de tu sitio:

location ~* \.webp$ {
    default_type image/webp;
    add_header Cache-Control "public, max-age=2592000";
}

location ~* \.avif$ {
    default_type image/avif;
    add_header Cache-Control "public, max-age=2592000";
}

# Cache para el resto de imagenes (opcional, mejora velocidad)
location ~* \.(jpg|jpeg|png|gif|svg)$ {
    add_header Cache-Control "public, max-age=2592000";
}
